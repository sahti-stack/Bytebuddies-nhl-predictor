[project]
name = "bytebuddies-nhl-predictor"
version = "0.1.0"
description = "NHL match outcome and goal prediction pipeline using dbt, DuckDB, Polars, and ML"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "altair>=6.3.0",
    "dbt-core>=1.12.6",
    "dbt-duckdb>=1.11.1",
    "duckdb>=2.0.0",
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "polars>=2.1.0",
    "pyarrow>=26.0.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]
